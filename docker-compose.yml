# Local development infrastructure only. Ports are bound to 127.0.0.1 — never expose them.
name: digital-archaeology

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      APP_DB_NAME: digital_archaeology
      APP_DB_USER: da
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-da_dev_only}
      VAULT_DB_NAME: da_vault
      VAULT_DB_USER: da_vault
      VAULT_DB_PASSWORD: ${VAULT_DB_PASSWORD:-vault_dev_only}
      SIGNER_RO_DB_USER: da_signer_ro
      SIGNER_RO_DB_PASSWORD: ${SIGNER_RO_DB_PASSWORD:-signer_ro_dev_only}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
