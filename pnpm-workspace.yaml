packages:
  - backend
  - frontend
  - shared
  - signer

# Packages allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  esbuild: true
  '@prisma/engines': true
  prisma: true
  argon2: true
  # Optional native accelerator for msgpackr (BullMQ); the pure-JS fallback is used instead.
  msgpackr-extract: false

# Security overrides for transitive dependencies of the Prisma CLI tooling (pnpm audit, Phase 13).
# None of these run in the server process; they are pinned to patched versions anyway.
overrides:
  lodash: '>=4.18.1'
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'
